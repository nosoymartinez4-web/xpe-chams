name: Build XPE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Build
      # Intenta buscar el archivo .sln primero. Si no existe, usa el .vcxproj.
      # Cambia 'TuProyecto.sln' o 'TuProyecto.vcxproj' por el nombre real de tus archivos.
      run: |
        # Primero intentamos con el .sln si existe
        if (Test-Path *.sln) {
            msbuild /p:Configuration=Release /p:Platform=x64 *.sln
        } else {
            # Si no hay .sln, construimos el .vcxproj directamente
            msbuild /p:Configuration=Release /p:Platform=x64 xpe-chams.vcxproj
        }

    - name: Upload DLL
      # Ajusta la ruta final de tu .dll. 
      # Generalmente está en la carpeta x64\Release\ o bin\Release\
      uses: actions/upload-artifact@v4
      with:
        name: xpe-chams
        path: x64/Release/xpe-chams.dll
