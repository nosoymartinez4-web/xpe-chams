name: Build XPE Chams

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Compile C++ Directly
      # Asegúrate de que 'TuArchivo.cpp' sea el nombre exacto de tu archivo C++
      # Si tienes varios .cpp, puedes usar *.cpp
      run: |
        cl /LD /EHsc /O2 /I. /Fe:chams.dll TuArchivo.cpp

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: chams-dll
        path: chams.dll
