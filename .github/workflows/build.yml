name: Build XPE Chams

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC Build Tools
      # Esta acción configura el PATH para que 'cl' esté disponible
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile
      # Asegúrate de cambiar 'TuArchivo.cpp' por el nombre REAL de tu archivo
      # Si tienes más de uno, usa *.cpp
      run: |
        cl /LD /EHsc /O2 /I. /Fe:chams.dll xpe_chams.cpp opengl32.lib glu32.lib

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: chams-dll
        path: chams.dll
