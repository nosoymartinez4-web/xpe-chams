name: Build XPE Chams

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC Build Tools
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Detours
      run: |
        choco install -y detours

    - name: Compile
      run: |
        cl /LD /EHsc /O2 /I. /Fe:chams.dll xpe_chams.cpp opengl32.lib detours.lib

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: chams-dll
        path: chams.dll
